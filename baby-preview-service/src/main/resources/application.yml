server:
  port: 8084

spring:
  application:
    name: baby-preview-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/nestie_preview_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

app:
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
  gemini:
    api-key: ${GEMINI_API_KEY:}
  huggingface:
    api-token: ${HF_API_TOKEN:}
  baby-preview:
    daily-limit: ${BABY_PREVIEW_MAX_PER_DAY:3}
    expiry-days: ${BABY_PREVIEW_EXPIRY_DAYS:30}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
