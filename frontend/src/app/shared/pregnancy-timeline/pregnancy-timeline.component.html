<div class="timeline-container">
  <div class="hero-card">
    <div class="hero-header">
      <span class="hero-pill">Month {{ currentMonth + 1 }}</span>
      <h3 class="hero-title">Growing with you, mama 💕</h3>
      <p class="hero-subtitle">This is how your little one looks right now.</p>
    </div>

    <div class="image-wrapper">
      <div class="image-container">
        <img
          [src]="months[currentMonth]"
          [alt]="'Pregnancy Month ' + (currentMonth + 1)"
          class="baby-image"
          loading="lazy"
        />
      </div>

      <div class="hover-pop">
        <p>Hey mommy, I'm in month {{ currentMonth + 1 }} 🍼</p>
      </div>
    </div>
  </div>
</div>
