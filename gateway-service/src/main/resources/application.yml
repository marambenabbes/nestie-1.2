server:
  port: ${GATEWAY_PORT:9090}

spring:
  application:
    name: nestie-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200,http://localhost,http://localhost:80"
            allowedMethods: "*"
            allowedHeaders: "*"
            exposedHeaders: "Authorization"
            allowCredentials: true
      routes:
        # ── Auth Service (public + protected) ──
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: user-service
          uri: http://${AUTH_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1

        # ── Pregnancy Service ──
        - id: pregnancy-profiles
          uri: http://${PREGNANCY_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/api/pregnancy-profiles/**
          filters:
            - StripPrefix=1

        - id: symptoms
          uri: http://${PREGNANCY_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/api/symptoms/**
          filters:
            - StripPrefix=1

        - id: medications
          uri: http://${PREGNANCY_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/api/medications/**
          filters:
            - StripPrefix=1

        - id: nutrition
          uri: http://${PREGNANCY_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/api/nutrition/**
          filters:
            - StripPrefix=1

        - id: baby-growth
          uri: http://${PREGNANCY_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/api/baby-growth/**
          filters:
            - StripPrefix=1

        - id: medication-reminders
          uri: http://${PREGNANCY_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/api/medication-reminders/**
          filters:
            - StripPrefix=1

        # ── Appointment Service ──
        - id: appointments
          uri: http://${APPOINTMENT_SERVICE_HOST:localhost}:8083
          predicates:
            - Path=/api/appointments/**
          filters:
            - StripPrefix=1

        - id: doctor-advice
          uri: http://${APPOINTMENT_SERVICE_HOST:localhost}:8083
          predicates:
            - Path=/api/doctor-advice/**
          filters:
            - StripPrefix=1

        # ── Baby Preview Service ──
        - id: baby-preview
          uri: http://${PREVIEW_SERVICE_HOST:localhost}:8084
          predicates:
            - Path=/api/baby-preview/**
          filters:
            - StripPrefix=1

        # ── Education Service ──
        - id: education-service
          uri: http://${EDUCATION_SERVICE_HOST:localhost}:8085
          predicates:
            - Path=/api/education/**
          filters:
            - StripPrefix=1

        # ── AI Service (FastAPI) ──
        - id: ai-service
          uri: http://${AI_SERVICE_HOST:localhost}:8000
          predicates:
            - Path=/api/ai/**

app:
  jwt:
    secret: ${JWT_SECRET:NestieAI2024SuperSecretKeyForJWTTokenGeneration256BitsLong!!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
